[package]
name = "darask-paint"
version = "0.12.2"
edition = "2021"
repository = "https://github.com/daraskme/darask-paint"

[dependencies]
ab_glyph = "=0.2.32"
arboard = "3.6.1"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
rfd = "0.17.2"

[lints.clippy]
# clippy 1.98 で新設された style lint。合成・保存のホットループは
# `as_chunks::<N>` へ移行済みで、残りはテストや 1 回限りの走査なので
# 一括置換の価値が薄く、許可して既存コードのまま維持する。
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
winresource = "0.1.31"

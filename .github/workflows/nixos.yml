name: NixOS
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --all-targets -- -D warnings
      - run: nix flake check
